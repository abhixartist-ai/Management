<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Image Uploader</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #d5d9e2;
    border-radius:8px;
}

input[type=file]{
    background:#fafbfc;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.uploadBtn{
    margin-top:18px;
    background:#2563eb;
    color:white;
    width:100%;
}

.copyBtn{
    background:#eef2ff;
    color:#1d4ed8;
    white-space:nowrap;
}

.status{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#f1f5f9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    vertical-align:middle;
}

.thumb{
    width:90px;
    height:90px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:8px;
}

.urlRow{
    display:flex;
    gap:8px;
    align-items:center;
}

.url{
    flex:1;
    padding:10px;
    background:#f8fafc;
    border:1px solid #d5d9e2;
    border-radius:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

@media(max-width:650px){
    th,td{
        padding:8px;
    }

    .thumb{
        width:65px;
        height:65px;
    }

    .urlRow{
        flex-direction:column;
        align-items:stretch;
    }

    .copyBtn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>GitHub Image URL Generator</h1>

<p>
Upload multiple images and get direct image URLs.
</p>

<label>GitHub Username</label>
<input id="username" placeholder="example: myusername">

<label>Repository Name</label>
<input id="repo" placeholder="example: product-images">

<label>Branch</label>
<input id="branch" value="main">

<label>GitHub Personal Access Token</label>
<input id="token" type="password"
       placeholder="github_pat_...">

<label>Select Images</label>
<input id="files" type="file" accept="image/*" multiple>

<button class="uploadBtn" onclick="uploadImages()">
Upload Images
</button>

<div id="status" class="status">
Ready.
</div>

<table>
<thead>
<tr>
<th>Image</th>
<th>Direct Image URL</th>
</tr>
</thead>

<tbody id="results"></tbody>
</table>

</div>
</div>

<script>

async function uploadImages(){

    const username =
        document.getElementById("username").value.trim();

    const repo =
        document.getElementById("repo").value.trim();

    const branch =
        document.getElementById("branch").value.trim() || "main";

    const token =
        document.getElementById("token").value.trim();

    const files =
        document.getElementById("files").files;

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");

    if(!username || !repo || !token){
        alert("Username, Repository and Token are required.");
        return;
    }

    if(files.length === 0){
        alert("Please select images.");
        return;
    }

    status.innerText =
        "Uploading " + files.length + " image(s)...";

    for(let i=0;i<files.length;i++){

        const file = files[i];

        try{

            const base64 =
                await fileToBase64(file);

            const cleanBase64 =
                base64.split(",")[1];

            const safeName =
                Date.now() + "-" +
                file.name
                .replace(/\s+/g,"-")
                .replace(/[^a-zA-Z0-9._-]/g,"");

            const path =
                "images/" + safeName;

            const apiUrl =
                `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

            const response =
                await fetch(apiUrl,{
                    method:"PUT",

                    headers:{
                        "Authorization":"Bearer " + token,
                        "Accept":"application/vnd.github+json",
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        message:"Upload " + safeName,
                        content:cleanBase64,
                        branch:branch
                    })
                });

            const data =
                await response.json();

            if(!response.ok){
                throw new Error(
                    data.message || "Upload failed"
                );
            }

            const imageUrl =
                `https://raw.githubusercontent.com/${username}/${repo}/${branch}/${path}`;

            addResult(file,imageUrl);

            status.innerText =
                `Uploaded ${i+1} of ${files.length}`;

        }catch(error){

            addError(file.name,error.message);

        }
    }

    status.innerText =
        "Upload complete.";
}


function fileToBase64(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload =
            () => resolve(reader.result);

        reader.onerror =
            reject;

        reader.readAsDataURL(file);
    });
}


function addResult(file,url){

    const results =
        document.getElementById("results");

    const row =
        document.createElement("tr");

    const imageCell =
        document.createElement("td");

    const img =
        document.createElement("img");

    img.src =
        URL.createObjectURL(file);

    img.className =
        "thumb";

    imageCell.appendChild(img);


    const urlCell =
        document.createElement("td");

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "urlRow";


    const input =
        document.createElement("input");

    input.className =
        "url";

    input.value =
        url;

    input.readOnly =
        true;


    const copy =
        document.createElement("button");

    copy.className =
        "copyBtn";

    copy.innerText =
        "Copy";


    copy.onclick =
        async function(){

            await navigator.clipboard.writeText(url);

            copy.innerText =
                "Copied!";

            setTimeout(()=>{
                copy.innerText =
                    "Copy";
            },1200);
        };


    wrapper.appendChild(input);

    wrapper.appendChild(copy);

    urlCell.appendChild(wrapper);

    row.appendChild(imageCell);

    row.appendChild(urlCell);

    results.appendChild(row);
}


function addError(filename,message){

    const results =
        document.getElementById("results");

    const row =
        document.createElement("tr");

    row.innerHTML =
        `<td>${filename}</td>
         <td style="color:red">
         Error: ${message}
         </td>`;

    results.appendChild(row);
}

</script>

</body>
</html>
